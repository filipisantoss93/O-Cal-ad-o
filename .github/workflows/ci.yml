name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar parser da Receita Federal
        run: |
          python3 -m py_compile scripts/import-receita-cnpj.py
          python3 -m unittest discover -s scripts/tests -p 'test_receita_cnpj.py'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código
        run: npm run lint

      - name: Compilar aplicação
        run: npm run build
