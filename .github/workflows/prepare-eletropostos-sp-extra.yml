name: Preparar lote adicional de eletropostos SP (fontes CC0)
on:
  push:
    branches: [feat/eletropostos-sp-lote-extra-20260921]
    paths:
      - ".github/workflows/prepare-eletropostos-sp-extra.yml"
      - "scripts/prepare-ocm-sp-extra.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-eletropostos-sp-extra
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar export aberto OCM
        shell: bash
        run: |
          set -euo pipefail
          OCM_DIR="$RUNNER_TEMP/ocm-export"
          git clone --quiet --depth=1 --filter=blob:none --sparse https://github.com/openchargemap/ocm-export.git "$OCM_DIR"
          git -C "$OCM_DIR" sparse-checkout set data/BR
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/openchargemap/ocm-export/main/data/referencedata.json \
            --output "$RUNNER_TEMP/ocm-reference.json"
          echo "OCM_DIR=$OCM_DIR" >> "$GITHUB_ENV"
      - name: Filtrar SP de fonte CC0
        shell: bash
        run: |
          python3 scripts/prepare-ocm-sp-extra.py \
            "$OCM_DIR/data/BR" "$RUNNER_TEMP/ocm-reference.json" \
            src/data/eletropostos-sp-ocm-extra | tee "$RUNNER_TEMP/eletropostos-summary.json"
          cat "$RUNNER_TEMP/eletropostos-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Registrar lote na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/eletropostos-sp-ocm-extra
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: lote adicional paulista de provedores CC0"
          git push origin HEAD:feat/eletropostos-sp-lote-extra-20260921
