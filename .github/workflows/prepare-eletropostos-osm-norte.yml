name: Preparar eletropostos OpenStreetMap Região Norte
on:
  push:
    branches: [feat/eletropostos-osm-norte-20260922]
    paths:
      - ".github/workflows/prepare-eletropostos-osm-norte.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar leitor OSM
        run: python3 -m pip install --quiet "osmium==4.1.1"
      - name: Baixar dados OSM da região Norte
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 \
            --max-time 1500 --user-agent "O-Calcadao/1.0 (+https://ocalcadao.com.br/contato)" \
            "https://download.geofabrik.de/south-america/brazil/norte-latest.osm.pbf" \
            --output "$RUNNER_TEMP/norte.osm.pbf"
          test "$(stat -c %s "$RUNNER_TEMP/norte.osm.pbf")" -ge 50000000
      - name: Preparar registros com coordenadas conhecidas
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-osm-br-charging.py \
            "$RUNNER_TEMP/norte.osm.pbf" src/data/eletropostos-norte-osm \
            | tee "$RUNNER_TEMP/norte-summary.json"
          cat "$RUNNER_TEMP/norte-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar dataset ODbL no ramo de trabalho
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/eletropostos-norte-osm
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: preparar eletropostos OSM do Norte"
          git push origin HEAD:feat/eletropostos-osm-norte-20260922
