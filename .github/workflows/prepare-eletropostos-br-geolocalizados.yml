name: Preparar eletropostos nacionais OCM geolocalizados
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-eletropostos-br-geolocalizados.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-eletropostos-br-geolocalizados
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Obter somente export publico OCM
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --filter=blob:none --sparse https://github.com/openchargemap/ocm-export.git "$RUNNER_TEMP/ocm-export"
          git -C "$RUNNER_TEMP/ocm-export" sparse-checkout set data/BR
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/openchargemap/ocm-export/main/data/referencedata.json \
            --output "$RUNNER_TEMP/ocm-reference.json"
      - name: Preparar locais geolocalizados com evidencia de conector ou potencia
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-ocm-br.py \
            "$RUNNER_TEMP/ocm-export/data/BR" "$RUNNER_TEMP/ocm-reference.json" \
            src/data/eletropostos-br-ocm-geolocalizados --geolocalizados-sem-endereco | tee "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Versionar lote independente
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/eletropostos-br-ocm-geolocalizados
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: preparar lote nacional OCM geolocalizado"
          git pull --rebase origin main
          git push origin HEAD:main
