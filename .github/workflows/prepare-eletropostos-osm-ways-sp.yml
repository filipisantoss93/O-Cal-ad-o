name: Preparar eletropostos por áreas OSM SP
on:
  push:
    branches: [feat/eletropostos-sp-lote-extra-20260921]
    paths:
      - ".github/workflows/prepare-eletropostos-osm-ways-sp.yml"
      - "scripts/prepare-osm-sp-charging-ways.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-eletropostos-osm-ways-sp
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar leitor de dados OSM
        run: python3 -m pip install --quiet "osmium==4.1.1"
      - name: Baixar extrato OSM do estado de São Paulo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 \
            --max-time 1200 \
            --user-agent "O-Calcadao/1.0 (+https://ocalcadao.com.br)" \
            "https://download.openstreetmap.fr/extracts/south-america/brazil/southeast/sao-paulo-latest.osm.pbf" \
            --output "$RUNNER_TEMP/sao-paulo.osm.pbf"
          test "$(stat -c %s "$RUNNER_TEMP/sao-paulo.osm.pbf")" -ge 100000000
      - name: Extrair pontos reais, endereços e informações técnicas
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-osm-sp-charging-ways.py \
            "$RUNNER_TEMP/sao-paulo.osm.pbf" \
            src/data/eletropostos-sp-osm-ways | tee "$RUNNER_TEMP/summary.json"
          cat "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Salvar dataset ODbL separado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/eletropostos-sp-osm-ways
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: lote ODbL adicional de eletropostos mapeados como áreas SP"
          git push origin HEAD:feat/eletropostos-sp-lote-extra-20260921
